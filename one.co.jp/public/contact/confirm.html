<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>
      入力内容の確認 | ホーニング加工、旋盤加工、溶接加工の株式会社ONE
    </title>
    <link
      rel="stylesheet"
      href="http://etc.dounokouno.com/ttXHTMLTemplate/css/screen.css"
    />
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=UA-47125520-40"
    ></script>

      window.dataLayer = window.dataLayer || [];

        dataLayer.push(arguments);

  <body class="home">
    <div id="header">
      <div class="container">
        <h1>入力内容の確認</h1>
      </div>
    </div>
    <div id="content">
      <div class="container">
        <div class="section">
          <!-- <h2>入力内容の確認</h2> -->
          <p>
            以下の内容でよろしければ、ページ下部の送信ボタンを押してください。<br />
            誤りがある場合は、前画面に戻って再度ご入力ください。
          </p>
          <table width="100%" class="alpha">
            {loop:$params}
            <tr>
              <th width="300">{$params[].key}&nbsp;</th>
              <td>{$params[].value.nl2br}&nbsp;</td>
            </tr>
            {/loop:$params} {loop:$files}
            <tr>
              <th>{$files[].key}&nbsp;</th>
              <td>
                <!-- {$files[].name}<br> -->
                <!-- <img src="index.php?file={$files[].tmp_name}" width="300"><br> -->
                <!-- <a href="index.php?file={$files[].tmp_name}" target="_blank" class="external">画像を別ウィンドウで開く</a> -->
                添付ファイルあり
              </td>
            </tr>
            {/loop:$files}
          </table>
          <div class="center">
            <form method="post" action="index.php" class="inline">
              {$hiddens}
              <input type="hidden" name="page" value="input" />
              <input type="submit" value="入力画面に戻る" />
            </form>
            &nbsp;
            <form method="post" action="index.php" class="inline">
              {$hiddens}
              <input type="hidden" name="page" value="finish" />
              <input type="submit" value="送信する" />
            </form>
          </div>
        </div>
      </div>
    </div>
  </body>
