<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>web design</title>

  <body class="drawer drawer--right">

              <li>

    <!--ページ内ナビゲーション -->

    <nav class="navigation">

            target="_blank"
            >Instagram</a
          >
        </li>
      </ul>
    </nav>

    <!--サブメニュー -->
    <script>
      $(function () {
        $(".submenu").hover(
          function () {
            $(".sub").css("display", "block");
          },
          function () {
            $(".sub").css("display", "none");
          }
        );
      });
    </script>

    <!--。個人制作 -->
    <div class="personal">
      <div class="contents">
        <div class="personal_left">
          <img src="../assets/PC/about/pc_ebara.png" alt="" />
          <!-- <div class="yajirushi_wrap">
                    <a href="../index.html#">
                        <p>Top</p>
                        <img src="../assets/PC/about/yajirushi.png" alt="" />
                    </a>
                </div> -->
        </div>
        <div class="personal_right">
          <h1>Web Design</h1>
          <h2>Kyosuke Ebara</h2>
          <p>
            PRサイトとECサイトの制作<br />モード好きの若者に”異質さ”をアシンメトリーなレイアウトで表現。一転してECサイトは落ち着きを取り入れるため安定したデザインに。
          </p>

      <div class="yajirushi_wrap">
